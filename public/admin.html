<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración MGPropiedades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="icon" href="rojo.png" type="image/png">
    <style>
        body { background-color: #f0f2f5; }
        .login-container { max-width: 450px; margin: 80px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .dashboard-container { display: none; }
        .admin-img-preview { height: 150px; object-fit: cover; width: 100%; }
        .nav-pills .nav-link.active { background-color: var(--bs-primary); }
        
        /* ESTILOS DEL CONTADOR DISCRETO */
        .contador-flotante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(33, 37, 41, 0.85); /* Gris oscuro semitransparente */
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1050;
            display: none; /* Oculto hasta que se inicie sesión */
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="loginSection" class="container">
        <div class="login-container text-center">
            <h3 class="mb-4 text-primary fw-bold">Acceso al Sistema</h3>
            
            <ul class="nav nav-pills nav-fill mb-4 gap-2" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-admin-tab" data-bs-toggle="pill" data-bs-target="#pills-admin" type="button">
                        <i class="bi bi-shield-lock-fill"></i> Administrador
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-corredor-tab" data-bs-toggle="pill" data-bs-target="#pills-corredor" type="button">
                        <i class="bi bi-person-badge-fill"></i> Corredor
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active" id="pills-admin" role="tabpanel">
                    <form onsubmit="handleLogin(event, 'admin')">
                        <div class="mb-3"><input type="email" id="emailAdmin" class="form-control" placeholder="Correo Admin" required></div>
                        <div class="mb-3"><input type="password" id="passAdmin" class="form-control" placeholder="Contraseña" required></div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar Admin</button>
                    </form>
                </div>
                <div class="tab-pane fade" id="pills-corredor" role="tabpanel">
                    <form onsubmit="handleLogin(event, 'corredor')">
                        <div class="mb-3"><input type="email" id="emailCorredor" class="form-control" placeholder="Correo Corredor" required></div>
                        <div class="mb-3"><input type="password" id="passCorredor" class="form-control" placeholder="Contraseña" required></div>
                        <button type="submit" class="btn btn-outline-primary w-100 fw-bold">Entrar Corredor</button>
                    </form>
                </div>
            </div>
            <p id="errorMsg" class="text-danger mt-3 fw-bold"></p>
            <a href="/" class="text-muted small mt-4 d-block">Volver al Inicio</a>
        </div>
    </div>

    <div id="dashboardSection" class="dashboard-container container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex gap-3 align-items-center">
                <h2 class="m-0">Panel Admin</h2>
                <button class="btn btn-dark btn-sm" data-bs-toggle="modal" data-bs-target="#modalCorredor"><i class="bi bi-person-plus"></i> Crear Corredor</button>
            </div>
            <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Salir</button>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
                    <div class="card-header bg-primary text-white fw-bold" id="formTitle">Nueva Propiedad</div>
                    <div class="card-body">
                        <form id="propiedadForm">
                            <input type="hidden" id="editId">
                            <div class="mb-2"><input type="text" id="titulo" class="form-control" placeholder="Título" required></div>
                            <div class="row mb-2">
                                <div class="col"><select id="operacion" class="form-select"><option>Venta</option><option>Arriendo</option></select></div>
                                <div class="col"><select id="tipo" class="form-select"><option>Casa</option><option>Departamento</option><option>Terreno</option></select></div>
                            </div>
                            <div class="mb-2"><input type="text" id="precio" class="form-control" placeholder="Precio" required onkeyup="formatoPesos(this)"></div>
                            <div class="mb-2"><input type="text" id="ubicacion" class="form-control" placeholder="Ubicación" required></div>
                            <div class="mb-2"><textarea id="descripcion" class="form-control" placeholder="Descripción..."></textarea></div>
                            <div class="row mb-2">
                                <div class="col"><input type="number" id="dormitorios" class="form-control" placeholder="Dorm" value="0"></div>
                                <div class="col"><input type="number" id="banos" class="form-control" placeholder="Baños" value="0"></div>
                            </div>
                            <div class="mb-3"><textarea id="imagen" class="form-control" placeholder="URLs imágenes..." required></textarea></div>
                            <div class="d-flex gap-2">
                                <button type="submit" id="btnSubmit" class="btn btn-success w-100">Publicar</button>
                                <button type="button" id="btnCancelar" onclick="cancelarEdicion()" class="btn btn-secondary" style="display:none;">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <h4>Todas las Propiedades</h4>
                <div id="listaAdmin" class="row g-3"></div>
            </div>
        </div>
    </div>

    <div id="badgeVisitas" class="contador-flotante">
        <i class="bi bi-bar-chart-fill text-info"></i> Visitas Web: <span id="numeroVisitas">0</span>
    </div>

    <div class="modal fade" id="modalCorredor" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white"><h5 class="modal-title">Nuevo Corredor</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="formCrearCorredor">
                        <div class="mb-3"><input type="text" id="newNombre" class="form-control" placeholder="Nombre" required></div>
                        <div class="mb-3"><input type="email" id="newEmail" class="form-control" placeholder="Email" required></div>
                        <div class="mb-3"><input type="password" id="newPass" class="form-control" placeholder="Contraseña" required></div>
                        <button type="submit" class="btn btn-primary w-100">Crear</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';
        let propiedades = [];

        // VALIDAR SESIÓN AL CARGAR
        document.addEventListener('DOMContentLoaded', () => {
            const t = localStorage.getItem('token');
            const r = localStorage.getItem('rolUsuario');
            if(t && r === 'admin') mostrarDashboard();
            if(t && r === 'corredor') window.location.href = '/panel-corredor';
        });

        // LOGIN
        async function handleLogin(e, source) {
            e.preventDefault();
            const email = document.getElementById(source==='admin'?'emailAdmin':'emailCorredor').value;
            const password = document.getElementById(source==='admin'?'passAdmin':'passCorredor').value;
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password})
                });
                const data = await res.json();
                
                if(res.ok) {
                    // VALIDACIÓN DE PUERTA
                    if(source === 'corredor' && data.rol === 'admin') {
                        document.getElementById('errorMsg').innerText = "Eres Admin. Usa la pestaña Admin."; return;
                    }
                    if(source === 'admin' && data.rol !== 'admin') {
                        document.getElementById('errorMsg').innerText = "No eres Admin. Usa la pestaña Corredor."; return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('rolUsuario', data.rol);
                    localStorage.setItem('nombreUsuario', data.nombre);
                    
                    if(data.rol === 'admin') mostrarDashboard();
                    else window.location.href = '/panel-corredor';
                } else {
                    document.getElementById('errorMsg').innerText = data.error;
                }
            } catch(e) { document.getElementById('errorMsg').innerText = "Error conexión"; }
        }

        function mostrarDashboard() {
            document.getElementById('loginSection').style.display='none';
            document.getElementById('dashboardSection').style.display='block';
            document.getElementById('badgeVisitas').style.display='flex'; // Muestra el contador
            cargarPropiedades();
            cargarVisitas(); // Llama al servidor para obtener las visitas
        }
        
        function cerrarSesion() { localStorage.clear(); location.reload(); }

        // --- CARGAR VISITAS ---
        async function cargarVisitas() {
            try {
                const res = await fetch(`${API_URL}/visitas`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('numeroVisitas').innerText = data.visitas;
                }
            } catch(e) { 
                console.error("Error cargando visitas"); 
            }
        }

        // CARGAR PROPIEDADES (ADMIN VE TODO)
        async function cargarPropiedades() {
            const res = await fetch(`${API_URL}/propiedades`);
            propiedades = (await res.json()).reverse();
            const lista = document.getElementById('listaAdmin');
            lista.innerHTML = '';
            
            propiedades.forEach(p => {
                const foto = p.imagen ? p.imagen.split(',')[0] : '';
                const tag = p.corredora !== 'MGPropiedades' ? 
                    `<span class="badge bg-info text-dark mb-1">${p.corredora}</span>` : 
                    `<span class="badge bg-secondary mb-1">MG</span>`;
                    
                lista.innerHTML += `
                    <div class="col-md-6"><div class="card h-100 shadow-sm"><div class="row g-0 h-100">
                        <div class="col-4"><img src="${foto}" class="img-fluid h-100 admin-img-preview"></div>
                        <div class="col-8"><div class="card-body p-2">
                            ${tag} <h6 class="text-truncate">${p.titulo}</h6>
                            <small class="text-muted">${p.precio} - ${p.operacion}</small>
                            <div class="mt-2">
                                <button onclick="editar(${p.id})" class="btn btn-warning btn-sm text-white"><i class="bi bi-pencil"></i></button>
                                <button onclick="eliminar(${p.id})" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </div>
                        </div></div>
                    </div></div></div>`;
            });
        }

        // GUARDAR PROPIEDAD
        document.getElementById('propiedadForm').addEventListener('submit', async(e)=>{
            e.preventDefault();
            const token = localStorage.getItem('token');
            const id = document.getElementById('editId').value;
            const data = {
                titulo: document.getElementById('titulo').value,
                operacion: document.getElementById('operacion').value,
                tipo: document.getElementById('tipo').value,
                precio: document.getElementById('precio').value,
                ubicacion: document.getElementById('ubicacion').value,
                descripcion: document.getElementById('descripcion').value,
                dormitorios: parseInt(document.getElementById('dormitorios').value)||0,
                banos: parseInt(document.getElementById('banos').value)||0,
                imagen: document.getElementById('imagen').value.replace(/\n/g,','),
                corredora: "MGPropiedades"
            };
            
            let url = `${API_URL}/propiedades`;
            let method = 'POST';
            if(id) { url += `/${id}`; method = 'PUT'; delete data.corredora; }

            const res = await fetch(url, {
                method, headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`}, body: JSON.stringify(data)
            });
            if(res.ok) { alert(id?"Editado":"Creado"); cancelarEdicion(); cargarPropiedades(); }
        });

        // CREAR CORREDOR
        document.getElementById('formCrearCorredor').addEventListener('submit', async(e)=>{
            e.preventDefault();
            const token = localStorage.getItem('token');
            const body = {
                nombre: document.getElementById('newNombre').value,
                email: document.getElementById('newEmail').value,
                password: document.getElementById('newPass').value
            };
            const res = await fetch(`${API_URL}/usuarios`, {
                method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body: JSON.stringify(body)
            });
            if(res.ok) { alert("Creado!"); bootstrap.Modal.getInstance(document.getElementById('modalCorredor')).hide(); }
        });

        function editar(id) {
            const p = propiedades.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('titulo').value = p.titulo;
            document.getElementById('operacion').value = p.operacion;
            document.getElementById('tipo').value = p.tipo;
            document.getElementById('precio').value = p.precio;
            document.getElementById('ubicacion').value = p.ubicacion;
            document.getElementById('descripcion').value = p.descripcion||'';
            document.getElementById('dormitorios').value = p.dormitorios;
            document.getElementById('banos').value = p.banos;
            document.getElementById('imagen').value = p.imagen;
            
            document.getElementById('formTitle').innerText = "Editar";
            document.getElementById('btnSubmit').innerText = "Guardar";
            document.getElementById('btnSubmit').className = "btn btn-warning w-100 text-white";
            document.getElementById('btnCancelar').style.display='block';
        }

        function cancelarEdicion() {
            document.getElementById('propiedadForm').reset();
            document.getElementById('editId').value='';
            document.getElementById('formTitle').innerText="Nueva Propiedad";
            document.getElementById('btnSubmit').innerText="Publicar";
            document.getElementById('btnSubmit').className="btn btn-success w-100";
            document.getElementById('btnCancelar').style.display='none';
        }

        async function eliminar(id) {
            if(confirm("¿Borrar?")) {
                await fetch(`${API_URL}/propiedades/${id}`, {method:'DELETE', headers:{'Authorization':`Bearer ${localStorage.getItem('token')}`}});
                cargarPropiedades();
            }
        }

        function formatoPesos(i) { i.value = i.value.replace(/\D/g,"").replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
    </script>
</body>
</html>
