<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración MGPropiedades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="icon" href="rojo.png" type="image/png">
    <style>
        body { background-color: #f0f2f5; }
        .login-container { max-width: 450px; margin: 80px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .dashboard-container { display: none; }
        .admin-img-preview { height: 150px; object-fit: cover; width: 100%; }
        .nav-pills .nav-link.active { background-color: var(--bs-primary); }
        
        /* ESTILOS DEL CONTADOR DISCRETO */
        .contador-flotante {
            position: fixed; bottom: 20px; right: 20px;
            background-color: rgba(33, 37, 41, 0.85); color: white;
            padding: 8px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1050; display: none; 
            align-items: center; gap: 8px; backdrop-filter: blur(4px);
        }

        .input-group-text { width: 40px; justify-content: center; }
        
        /* ZONA DRAG & DROP PARA FOTOS */
        .drop-zone {
            border: 2px dashed #0d6efd;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            background-color: #f8faff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background-color: #e2edff;
            border-color: #0043a8;
            transform: scale(1.01);
        }
        .galeria-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .preview-card {
            position: relative;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            border: 1px solid #dee2e6;
        }
        .preview-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-quitar-foto {
            position: absolute;
            top: 3px;
            right: 3px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-quitar-foto:hover {
            transform: scale(1.15);
            background: #dc3545;
        }
        .badge-portada {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 110, 253, 0.85);
            color: white;
            font-size: 0.65rem;
            text-align: center;
            font-weight: bold;
            padding: 1px 0;
        }
    </style>
</head>
<body>

    <div id="loginSection" class="container">
        <div class="login-container text-center">
            <h3 class="mb-4 text-primary fw-bold">Acceso al Sistema</h3>
            
            <ul class="nav nav-pills nav-fill mb-4 gap-2" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-admin-tab" data-bs-toggle="pill" data-bs-target="#pills-admin" type="button">
                        <i class="bi bi-shield-lock-fill"></i> Administrador
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-corredor-tab" data-bs-toggle="pill" data-bs-target="#pills-corredor" type="button">
                        <i class="bi bi-person-badge-fill"></i> Corredor
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active" id="pills-admin" role="tabpanel">
                    <form onsubmit="handleLogin(event, 'admin')">
                        <div class="mb-3"><input type="email" id="emailAdmin" class="form-control" placeholder="Correo Admin" required></div>
                        <div class="mb-3"><input type="password" id="passAdmin" class="form-control" placeholder="Contraseña" required></div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar Admin</button>
                    </form>
                </div>
                <div class="tab-pane fade" id="pills-corredor" role="tabpanel">
                    <form onsubmit="handleLogin(event, 'corredor')">
                        <div class="mb-3"><input type="email" id="emailCorredor" class="form-control" placeholder="Correo Corredor" required></div>
                        <div class="mb-3"><input type="password" id="passCorredor" class="form-control" placeholder="Contraseña" required></div>
                        <button type="submit" class="btn btn-outline-primary w-100 fw-bold">Entrar Corredor</button>
                    </form>
                </div>
            </div>
            <p id="errorMsg" class="text-danger mt-3 fw-bold"></p>
            <a href="/" class="text-muted small mt-4 d-block">Volver al Inicio</a>
        </div>
    </div>

    <div id="dashboardSection" class="dashboard-container container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex gap-3 align-items-center">
                <h2 class="m-0">Panel Admin</h2>
                <button class="btn btn-dark btn-sm" data-bs-toggle="modal" data-bs-target="#modalCorredor"><i class="bi bi-person-plus"></i> Crear Corredor</button>
            </div>
            <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Salir</button>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
                    <div class="card-header bg-primary text-white fw-bold" id="formTitle">Nueva Propiedad</div>
                    <div class="card-body">
                        <form id="propiedadForm">
                            <input type="hidden" id="editId">
                            <div class="mb-2"><input type="text" id="titulo" class="form-control" placeholder="Título" required></div>
                            <div class="row mb-2">
                                <div class="col">
                                    <select id="operacion" class="form-select">
                                        <option value="Venta">Venta</option>
                                        <option value="Arriendo">Arriendo</option>
                                        <option value="Vendida">Vendida (Cinta Roja)</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <select id="tipo" class="form-select">
                                        <option value="Casa">Casa</option>
                                        <option value="Departamento">Departamento</option>
                                        <option value="Parcelas / Terrenos">Parcelas / Terrenos</option>
                                        <option value="Bosques / Predios">Bosques / Predios</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-2"><input type="text" id="precio" class="form-control" placeholder="Precio (Ej: $45.000.000 o UF 2.500)" required onkeyup="formatoPrecioInteligente(this)"></div>
                            <div class="mb-2"><input type="text" id="ubicacion" class="form-control" placeholder="Ubicación" required></div>
                            <div class="mb-2"><textarea id="descripcion" class="form-control" placeholder="Descripción de la propiedad..." rows="3"></textarea></div>
                            
                            <label class="small fw-bold text-muted mb-1 mt-2">Características Principales</label>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <div class="input-group input-group-sm shadow-sm" title="Dormitorios">
                                        <span class="input-group-text bg-white text-primary border-end-0"><i class="bi bi-door-closed"></i></span>
                                        <input type="number" id="dormitorios" class="form-control border-start-0" placeholder="Dormitorios">
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="input-group input-group-sm shadow-sm" title="Baños">
                                        <span class="input-group-text bg-white text-primary border-end-0"><i class="bi bi-droplet"></i></span>
                                        <input type="number" id="banos" class="form-control border-start-0" placeholder="Baños">
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="input-group input-group-sm shadow-sm" title="Estacionamientos">
                                        <span class="input-group-text bg-white text-primary border-end-0"><i class="bi bi-car-front"></i></span>
                                        <input type="number" id="estacionamientos" class="form-control border-start-0" placeholder="Estacionam.">
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="input-group input-group-sm shadow-sm" title="Metros Cuadrados (m²)">
                                        <span class="input-group-text bg-white text-primary border-end-0"><i class="bi bi-arrows-fullscreen"></i></span>
                                        <input type="number" id="metros" class="form-control border-start-0" placeholder="Metros m²">
                                    </div>
                                </div>
                            </div>

                            <!-- SISTEMA DRAG & DROP DE FOTOS -->
                            <div class="mb-4">
                                <label class="small fw-bold text-muted mb-2 d-flex justify-content-between align-items-center">
                                    <span>Fotos de la Propiedad</span>
                                    <span class="badge bg-secondary rounded-pill" id="contadorFotos">0 fotos</span>
                                </label>
                                
                                <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
                                    <i class="bi bi-cloud-arrow-up-fill fs-1 text-primary d-block mb-1"></i>
                                    <span class="fw-bold text-dark d-block" style="font-size: 0.9rem;">Arrastra tus fotos aquí</span>
                                    <small class="text-muted">o haz clic para elegir desde tu PC</small>
                                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="procesarArchivos(this.files)">
                                </div>

                                <div id="estadoCargaFotos" class="text-center text-primary small fw-bold mt-2" style="display: none;">
                                    <div class="spinner-border spinner-border-sm me-1" role="status"></div> Optimizando fotos...
                                </div>

                                <div id="galeriaPreview" class="galeria-preview"></div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" id="btnSubmit" class="btn btn-success w-100 fw-bold">Publicar Propiedad</button>
                                <button type="button" id="btnCancelar" onclick="cancelarEdicion()" class="btn btn-secondary" style="display:none;">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <h4 class="mb-3 fw-bold text-muted">Todas las Propiedades</h4>
                <div id="listaAdmin" class="row g-3"></div>
            </div>
        </div>
    </div>

    <div id="badgeVisitas" class="contador-flotante">
        <i class="bi bi-bar-chart-fill text-info"></i> Visitas Web: <span id="numeroVisitas">0</span>
    </div>

    <div class="modal fade" id="modalCorredor" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0" style="border-radius: 12px;">
                <div class="modal-header bg-dark text-white"><h5 class="modal-title">Nuevo Corredor</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="formCrearCorredor">
                        <div class="mb-3"><input type="text" id="newNombre" class="form-control" placeholder="Nombre" required></div>
                        <div class="mb-3"><input type="email" id="newEmail" class="form-control" placeholder="Email" required></div>
                        <div class="mb-3"><input type="password" id="newPass" class="form-control" placeholder="Contraseña" required></div>
                        <button type="submit" class="btn btn-primary w-100">Crear Corredor</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';
        let propiedades = [];
        let fotosCargadas = [];

        function separarFotos(str) {
            if (!str) return [];
            return str.split(/,(?=\s*(?:https?:|data:))|[\n]+/).map(s => s.trim()).filter(Boolean);
        }

        // --- CONFIGURACIÓN DE EVENTOS DRAG & DROP ---
        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            procesarArchivos(files);
        });

        // --- PROCESAMIENTO Y COMPRESIÓN AUTOMÁTICA DE FOTOS ---
        async function procesarArchivos(files) {
            const archivosArray = Array.from(files).filter(file => file.type.startsWith('image/'));
            if (archivosArray.length === 0) return;

            document.getElementById('estadoCargaFotos').style.display = 'block';

            for (const file of archivosArray) {
                try {
                    const base64Comprimido = await comprimirImagen(file);
                    fotosCargadas.push(base64Comprimido);
                } catch (err) {
                    console.error("Error procesando imagen:", err);
                }
            }

            document.getElementById('estadoCargaFotos').style.display = 'none';
            document.getElementById('fileInput').value = '';
            renderizarGaleriaPreview();
        }

        function comprimirImagen(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = err => reject(err);
                };
                reader.onerror = err => reject(err);
            });
        }

        function renderizarGaleriaPreview() {
            const galeria = document.getElementById('galeriaPreview');
            const contador = document.getElementById('contadorFotos');
            galeria.innerHTML = '';
            contador.innerText = `${fotosCargadas.length} ${fotosCargadas.length === 1 ? 'foto' : 'fotos'}`;

            fotosCargadas.forEach((fotoSrc, index) => {
                const div = document.createElement('div');
                div.className = 'preview-card';
                div.innerHTML = `
                    <img src="${fotoSrc}" alt="Preview ${index + 1}">
                    ${index === 0 ? '<div class="badge-portada">Principal</div>' : ''}
                    <button type="button" class="btn-quitar-foto" onclick="quitarFoto(${index})" title="Eliminar foto">
                        <i class="bi bi-x-lg"></i>
                    </button>
                `;
                galeria.appendChild(div);
            });
        }

        function quitarFoto(index) {
            fotosCargadas.splice(index, 1);
            renderizarGaleriaPreview();
        }

        // VALIDAR SESIÓN AL CARGAR
        document.addEventListener('DOMContentLoaded', () => {
            const t = localStorage.getItem('token');
            const r = localStorage.getItem('rolUsuario');
            if(t && r === 'admin') mostrarDashboard();
            if(t && r === 'corredor') window.location.href = '/panel-corredor';
        });

        async function handleLogin(e, source) {
            e.preventDefault();
            const email = document.getElementById(source==='admin'?'emailAdmin':'emailCorredor').value;
            const password = document.getElementById(source==='admin'?'passAdmin':'passCorredor').value;
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password})
                });
                const data = await res.json();
                
                if(res.ok) {
                    if(source === 'corredor' && data.rol === 'admin') {
                        document.getElementById('errorMsg').innerText = "Eres Admin. Usa la pestaña Admin."; return;
                    }
                    if(source === 'admin' && data.rol !== 'admin') {
                        document.getElementById('errorMsg').innerText = "No eres Admin. Usa la pestaña Corredor."; return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('rolUsuario', data.rol);
                    localStorage.setItem('nombreUsuario', data.nombre);
                    
                    if(data.rol === 'admin') mostrarDashboard();
                    else window.location.href = '/panel-corredor';
                } else {
                    document.getElementById('errorMsg').innerText = data.error;
                }
            } catch(e) { document.getElementById('errorMsg').innerText = "Error conexión"; }
        }

        function mostrarDashboard() {
            document.getElementById('loginSection').style.display='none';
            document.getElementById('dashboardSection').style.display='block';
            document.getElementById('badgeVisitas').style.display='flex'; 
            
            fotosCargadas = [];
            renderizarGaleriaPreview();

            cargarPropiedades();
            cargarVisitas(); 
        }
        
        function cerrarSesion() { localStorage.clear(); location.reload(); }

        async function cargarVisitas() {
            try {
                const res = await fetch(`${API_URL}/visitas`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('numeroVisitas').innerText = data.visitas;
                }
            } catch(e) { console.error("Error cargando visitas"); }
        }

        async function cargarPropiedades() {
            const res = await fetch(`${API_URL}/propiedades`);
            propiedades = (await res.json()).reverse();
            const lista = document.getElementById('listaAdmin');
            lista.innerHTML = '';
            
            propiedades.forEach(p => {
                const listaFotos = separarFotos(p.imagen);
                const foto = listaFotos.length > 0 ? listaFotos[0] : '';
                const tag = p.corredora !== 'MGPropiedades' ? 
                    `<span class="badge bg-info text-dark mb-1">${p.corredora}</span>` : 
                    `<span class="badge bg-secondary mb-1">MG</span>`;
                const badgeVendida = p.operacion === 'Vendida' ? `<span class="badge bg-danger mb-1 ms-1">VENDIDA</span>` : '';
                    
                lista.innerHTML += `
                    <div class="col-md-6"><div class="card h-100 shadow-sm border-0"><div class="row g-0 h-100">
                        <div class="col-4"><img src="${foto}" class="img-fluid h-100 admin-img-preview rounded-start"></div>
                        <div class="col-8"><div class="card-body p-3">
                            ${tag}${badgeVendida} <h6 class="text-truncate fw-bold">${p.titulo}</h6>
                            <small class="text-primary fw-bold">${p.precio}</small><br>
                            <small class="text-muted"><i class="bi bi-geo-alt"></i> ${p.ubicacion}</small>
                            <div class="mt-2 d-flex gap-1">
                                <button onclick="editar(${p.id})" class="btn btn-outline-warning btn-sm border-0"><i class="bi bi-pencil fs-6"></i></button>
                                <button onclick="eliminar(${p.id})" class="btn btn-outline-danger btn-sm border-0"><i class="bi bi-trash fs-6"></i></button>
                            </div>
                        </div></div>
                    </div></div></div>`;
            });
        }

        document.getElementById('propiedadForm').addEventListener('submit', async(e)=>{
            e.preventDefault();
            const token = localStorage.getItem('token');
            const id = document.getElementById('editId').value;
            
            if(fotosCargadas.length === 0) {
                alert("Debes subir al menos una foto de la propiedad.");
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            const textoOriginal = btnSubmit.innerText;
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Guardando...";

            const data = {
                titulo: document.getElementById('titulo').value,
                operacion: document.getElementById('operacion').value,
                tipo: document.getElementById('tipo').value,
                precio: document.getElementById('precio').value,
                ubicacion: document.getElementById('ubicacion').value,
                descripcion: document.getElementById('descripcion').value,
                dormitorios: parseInt(document.getElementById('dormitorios').value)||0,
                banos: parseInt(document.getElementById('banos').value)||0,
                estacionamientos: parseInt(document.getElementById('estacionamientos').value)||0,
                metros: parseInt(document.getElementById('metros').value)||0,
                imagen: fotosCargadas.join('\n'),
                corredora: "MGPropiedades"
            };
            
            let url = `${API_URL}/propiedades`;
            let method = 'POST';
            if(id) { url += `/${id}`; method = 'PUT'; delete data.corredora; }

            try {
                const res = await fetch(url, {
                    method, headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`}, body: JSON.stringify(data)
                });
                if(res.ok) { 
                    alert(id ? "Propiedad Actualizada" : "Propiedad Creada Exitosamente"); 
                    cancelarEdicion(); 
                    cargarPropiedades(); 
                } else {
                    alert("Hubo un problema al guardar la propiedad.");
                }
            } catch (err) {
                alert("Error de conexión al guardar.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = textoOriginal;
            }
        });

        document.getElementById('formCrearCorredor').addEventListener('submit', async(e)=>{
            e.preventDefault();
            const token = localStorage.getItem('token');
            const body = {
                nombre: document.getElementById('newNombre').value,
                email: document.getElementById('newEmail').value,
                password: document.getElementById('newPass').value
            };
            const res = await fetch(`${API_URL}/usuarios`, {
                method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body: JSON.stringify(body)
            });
            if(res.ok) { alert("Corredor Creado!"); bootstrap.Modal.getInstance(document.getElementById('modalCorredor')).hide(); }
        });

        function editar(id) {
            const p = propiedades.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('titulo').value = p.titulo;
            document.getElementById('operacion').value = p.operacion;
            document.getElementById('tipo').value = p.tipo === 'Terreno' ? 'Parcelas / Terrenos' : p.tipo;
            document.getElementById('precio').value = p.precio;
            document.getElementById('ubicacion').value = p.ubicacion;
            document.getElementById('descripcion').value = p.descripcion || '';
            document.getElementById('dormitorios').value = p.dormitorios || '';
            document.getElementById('banos').value = p.banos || '';
            document.getElementById('estacionamientos').value = p.estacionamientos || '';
            document.getElementById('metros').value = p.metros || '';
            
            fotosCargadas = separarFotos(p.imagen);
            renderizarGaleriaPreview();
            
            document.getElementById('formTitle').innerText = "Editando: " + p.titulo;
            document.getElementById('btnSubmit').innerText = "Guardar Cambios";
            document.getElementById('btnSubmit').className = "btn btn-warning w-100 text-white fw-bold";
            document.getElementById('btnCancelar').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }

        function cancelarEdicion() {
            document.getElementById('propiedadForm').reset();
            document.getElementById('editId').value='';
            
            fotosCargadas = [];
            renderizarGaleriaPreview();

            document.getElementById('formTitle').innerText="Nueva Propiedad";
            document.getElementById('btnSubmit').innerText="Publicar Propiedad";
            document.getElementById('btnSubmit').className="btn btn-success w-100 fw-bold";
            document.getElementById('btnCancelar').style.display='none';
        }

        async function eliminar(id) {
            if(confirm("¿Estás seguro de que deseas eliminar esta propiedad de forma permanente?")) {
                await fetch(`${API_URL}/propiedades/${id}`, {method:'DELETE', headers:{'Authorization':`Bearer ${localStorage.getItem('token')}`}});
                cargarPropiedades();
            }
        }

        // Formateador inteligente que soporta tanto Pesos ($) como UF
        function formatoPrecioInteligente(input) {
            let val = input.value.toUpperCase();
            const esUF = val.includes('U') || val.includes('F');
            const numeros = val.replace(/\D/g, "");
            if (!numeros) {
                input.value = esUF ? "UF " : "";
                return;
            }
            const formateado = numeros.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            input.value = esUF ? `UF ${formateado}` : `$${formateado}`;
        }
    </script>
