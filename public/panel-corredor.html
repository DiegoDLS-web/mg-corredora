<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corredores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="icon" href="rojo.png" type="image/png">
    <style> body { background-color: #f8f9fa; } .img-prev { height: 100px; object-fit: cover; } </style>
</head>
<body>
    <header class="bg-primary text-white py-3 mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="m-0"><i class="bi bi-person-badge"></i> Panel Corredor</h4>
            <div class="d-flex gap-2 align-items-center">
                <span id="welcomeMsg" class="small fw-bold"></span>
                <button onclick="logout()" class="btn btn-sm btn-light text-primary fw-bold">Salir</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card sticky-top" style="top: 20px;">
                    <div class="card-header bg-white fw-bold" id="formTitle">Publicar Propiedad</div>
                    <div class="card-body">
                        <form id="propiedadForm">
                            <input type="hidden" id="editId">
                            <div class="mb-2"><input type="text" id="titulo" class="form-control" placeholder="Título" required></div>
                            <div class="row mb-2">
                                <div class="col"><select id="operacion" class="form-select"><option>Venta</option><option>Arriendo</option></select></div>
                                <div class="col"><select id="tipo" class="form-select"><option>Casa</option><option>Departamento</option><option>Terreno</option></select></div>
                            </div>
                            <div class="mb-2"><input type="text" id="precio" class="form-control" placeholder="Precio" required onkeyup="formatoPesos(this)"></div>
                            <div class="mb-2"><input type="text" id="ubicacion" class="form-control" placeholder="Ubicación" required></div>
                            <div class="mb-2"><textarea id="descripcion" class="form-control" placeholder="Descripción..."></textarea></div>
                            <div class="row mb-2">
                                <div class="col"><input type="number" id="dormitorios" class="form-control" placeholder="Dorm" value="0"></div>
                                <div class="col"><input type="number" id="banos" class="form-control" placeholder="Baños" value="0"></div>
                            </div>
                            <div class="mb-3"><textarea id="imagen" class="form-control" placeholder="URLs imágenes..." required></textarea></div>
                            <div class="d-grid gap-2">
                                <button type="submit" id="btnSubmit" class="btn btn-primary">Publicar</button>
                                <button type="button" id="btnCancelar" onclick="cancelar()" class="btn btn-secondary" style="display:none;">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <h5>Mis Propiedades</h5>
                <div id="lista" class="row g-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';
        let misProps = [];
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rolUsuario');
        const user = localStorage.getItem('nombreUsuario');

        // SEGURIDAD
        if(!token) window.location.href = '/admin';
        if(rol === 'admin') window.location.href = '/admin'; // Admin no debe estar aqui
        if(rol !== 'corredor') window.location.href = '/admin';

        document.getElementById('welcomeMsg').innerText = user;
        cargarMisProps();

        async function cargarMisProps() {
            const res = await fetch(`${API_URL}/propiedades?corredor=${encodeURIComponent(user)}`);
            misProps = (await res.json()).reverse();
            const lista = document.getElementById('lista');
            lista.innerHTML = '';
            
            misProps.forEach(p => {
                const foto = p.imagen ? p.imagen.split(',')[0] : '';
                lista.innerHTML += `
                    <div class="col-12"><div class="card h-100"><div class="row g-0">
                        <div class="col-3"><img src="${foto}" class="img-fluid h-100 w-100 img-prev"></div>
                        <div class="col-9"><div class="card-body p-2 d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="m-0 text-truncate">${p.titulo}</h6>
                                <small class="text-success fw-bold">${p.precio}</small>
                            </div>
                            <div>
                                <button onclick="editar(${p.id})" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></button>
                                <button onclick="eliminar(${p.id})" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </div>
                        </div></div>
                    </div></div></div>`;
            });
        }

        document.getElementById('propiedadForm').addEventListener('submit', async(e)=>{
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                titulo: document.getElementById('titulo').value,
                operacion: document.getElementById('operacion').value,
                tipo: document.getElementById('tipo').value,
                precio: document.getElementById('precio').value,
                ubicacion: document.getElementById('ubicacion').value,
                descripcion: document.getElementById('descripcion').value,
                dormitorios: parseInt(document.getElementById('dormitorios').value)||0,
                banos: parseInt(document.getElementById('banos').value)||0,
                imagen: document.getElementById('imagen').value.replace(/\n/g,','),
                corredora: user
            };
            
            let url = `${API_URL}/propiedades`;
            let method = 'POST';
            if(id) { url += `/${id}`; method = 'PUT'; }

            const res = await fetch(url, {
                method, headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`}, body: JSON.stringify(data)
            });
            if(res.ok) { alert("Guardado!"); cancelar(); cargarMisProps(); }
            else alert("Error");
        });

        function editar(id) {
            const p = misProps.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('titulo').value = p.titulo;
            document.getElementById('operacion').value = p.operacion;
            document.getElementById('tipo').value = p.tipo;
            document.getElementById('precio').value = p.precio;
            document.getElementById('ubicacion').value = p.ubicacion;
            document.getElementById('descripcion').value = p.descripcion||'';
            document.getElementById('dormitorios').value = p.dormitorios;
            document.getElementById('banos').value = p.banos;
            document.getElementById('imagen').value = p.imagen;
            
            document.getElementById('formTitle').innerText = "Editar";
            document.getElementById('btnSubmit').innerText = "Guardar";
            document.getElementById('btnSubmit').className = "btn btn-warning w-100 text-white";
            document.getElementById('btnCancelar').style.display='block';
        }

        function cancelar() {
            document.getElementById('propiedadForm').reset();
            document.getElementById('editId').value='';
            document.getElementById('formTitle').innerText="Publicar";
            document.getElementById('btnSubmit').innerText="Publicar";
            document.getElementById('btnSubmit').className="btn btn-primary w-100";
            document.getElementById('btnCancelar').style.display='none';
        }

        async function eliminar(id) {
            if(confirm("¿Borrar?")) {
                await fetch(`${API_URL}/propiedades/${id}`, {method:'DELETE', headers:{'Authorization':`Bearer ${token}`}});
                cargarMisProps();
            }
        }

        function logout() { localStorage.clear(); window.location.href='/admin'; }
        function formatoPesos(i) { i.value = i.value.replace(/\D/g,"").replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
    </script>
</body>
</html>
